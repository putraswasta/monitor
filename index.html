<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tianpower BMS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #050505; color: #e5e5e5; }
        .card-bg { background-color: #1a1a1a; }
        
        /* Progress bar animasi halus */
        .soc-bar { transition: width 0.5s ease-in-out; }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header & Status -->
    <div class="max-w-7xl mx-auto mb-6 flex flex-col md:flex-row justify-between items-center bg-[#1a1a1a] p-4 rounded-xl border border-gray-800">
        <div class="flex items-center space-x-4">
            <h1 class="text-xl font-bold text-white tracking-wide">TIANPOWER <span class="text-blue-500">BMS</span></h1>
            <span class="text-gray-500 text-sm">| 50 Site Monitoring</span>
        </div>
        <div id="status-koneksi" class="mt-2 md:mt-0 px-3 py-1 rounded text-xs font-semibold bg-yellow-500/20 text-yellow-500 border border-yellow-500/30">
            CONNECTING...
        </div>
    </div>

    <!-- Grid Container untuk Rumah -->
    <div id="grid-rumah" class="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
        <!-- Teks Muncul Sebelum Ada Data -->
        <div id="pesan-tunggu" class="col-span-full text-center text-gray-500 py-10 italic">
            Menunggu telemetri dari perangkat BMS...
        </div>
        <!-- Kartu-kartu akan muncul otomatis di sini -->
    </div>

    <script>
        // === KONFIGURASI HIVEMQ ===
        const mqtt_server = "419f80bf9fe7493f984ad0a01e48ffd5.s1.eu.hivemq.cloud"; // Ganti URL
        const mqtt_port = 8884; 
        const mqtt_user = "ADMIN_putra.jaya.swasta"; // Ganti Username
        const mqtt_pass = "putra.jaya.swasta"; // Ganti Password
        const mqtt_topic_admin = "bms/#"; 

        const client_id = "WebGrid_" + Math.random().toString(16).substr(2, 8);
        const client = new Paho.MQTT.Client(mqtt_server, mqtt_port, client_id);

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        const options = {
            useSSL: true,
            userName: mqtt_user,
            password: mqtt_pass,
            onSuccess: onConnect,
            onFailure: onFail
        };

        client.connect(options);

        function onConnect() {
            const statusBox = document.getElementById("status-koneksi");
            statusBox.innerText = "CONNECTED";
            statusBox.className = "mt-2 md:mt-0 px-3 py-1 rounded text-xs font-semibold bg-green-500/20 text-green-500 border border-green-500/30";
            client.subscribe(mqtt_topic_admin);
        }

        function onFail(message) {
            const statusBox = document.getElementById("status-koneksi");
            statusBox.innerText = "CONNECTION FAILED";
            statusBox.className = "mt-2 md:mt-0 px-3 py-1 rounded text-xs font-semibold bg-red-500/20 text-red-500 border border-red-500/30";
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                const statusBox = document.getElementById("status-koneksi");
                statusBox.innerText = "DISCONNECTED";
                statusBox.className = "mt-2 md:mt-0 px-3 py-1 rounded text-xs font-semibold bg-red-500/20 text-red-500 border border-red-500/30";
                setTimeout(() => client.connect(options), 5000);
            }
        }

        function onMessageArrived(message) {
            document.getElementById("pesan-tunggu").style.display = "none";
            const topik = message.destinationName; 
            const idRumah = topik.split("/")[1]; // Contoh: rumah01
            
            try {
                const payload = JSON.parse(message.payloadString);
                
                // Ambil data dasar
                const volt = parseFloat(payload.voltage || 0);
                const amp = parseFloat(payload.current || 0);
                const soc = parseInt(payload.soc || 0);
                
                // Hitung Daya (Watt) = Volt x Amp, atau ambil dari payload jika ada
                let watt = payload.power;
                if (watt === undefined) {
                    watt = (volt * amp).toFixed(2);
                }

                const waktu = new Date().toLocaleTimeString('id-ID', { hour12: false });

                buatAtauPerbaruiKartu(idRumah, volt, amp, soc, watt, waktu);
            } catch (e) {
                console.log("Abaikan data non-JSON:", message.payloadString);
            }
        }

        function buatAtauPerbaruiKartu(id, volt, amp, soc, watt, waktu) {
            let cardId = "card-" + id;
            let card = document.getElementById(cardId);
            const grid = document.getElementById("grid-rumah");

            // Jika kartu belum ada, buat struktur HTML-nya
            if (!card) {
                card = document.createElement("div");
                card.id = cardId;
                card.className = "card-bg p-5 rounded-xl border border-gray-800 shadow-lg relative";
                
                card.innerHTML = `
                    <!-- Judul & Indikator -->
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-gray-200 text-lg capitalize">Site: ${id}</h2>
                        <div class="w-3 h-3 rounded-full bg-gray-500" id="dot-${id}"></div>
                    </div>

                    <!-- Progress Bar SOC -->
                    <div class="mb-5">
                        <div class="flex justify-between text-xs font-semibold text-gray-400 mb-1">
                            <span>SOC</span>
                            <span id="soc-txt-${id}" class="text-white">0%</span>
                        </div>
                        <div class="w-full bg-gray-700 h-2 rounded-full overflow-hidden">
                            <div id="soc-bar-${id}" class="soc-bar bg-green-500 h-full" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Grid Data (Tegangan, Arus, Daya) -->
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <!-- Tegangan -->
                        <div>
                            <div class="flex items-center text-gray-500 text-xs mb-1">
                                <span class="text-yellow-500 mr-1">⚡</span> Voltage
                            </div>
                            <div class="font-bold text-gray-100 text-lg"><span id="volt-${id}">0.00</span> <span class="text-xs text-gray-500">V</span></div>
                        </div>
                        
                        <!-- Arus -->
                        <div>
                            <div class="flex items-center text-gray-500 text-xs mb-1">
                                <span class="text-blue-500 mr-1">🔵</span> Current
                            </div>
                            <div class="font-bold text-gray-100 text-lg"><span id="amp-${id}">0.00</span> <span class="text-xs text-gray-500">A</span></div>
                        </div>

                        <!-- Daya (Watt) -->
                        <div>
                            <div class="flex items-center text-gray-500 text-xs mb-1">
                                <span class="text-red-500 mr-1">⚡</span> Power
                            </div>
                            <div class="font-bold text-gray-100 text-lg"><span id="watt-${id}">0.0</span> <span class="text-xs text-gray-500">W</span></div>
                        </div>
                    </div>

                    <!-- Footer / Waktu -->
                    <div class="border-t border-gray-800 mt-4 pt-3 flex justify-between items-center text-xs text-gray-500">
                        <span>Status: <span class="text-green-500">Normal</span></span>
                        <div class="flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span id="waktu-${id}">--:--:--</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            }

            // Update nilai-nilai di dalam kartu yang sudah ada
            document.getElementById(`volt-${id}`).innerText = volt;
            document.getElementById(`amp-${id}`).innerText = amp;
            document.getElementById(`watt-${id}`).innerText = watt;
            document.getElementById(`soc-txt-${id}`).innerText = soc + "%";
            document.getElementById(`soc-bar-${id}`).style.width = soc + "%";
            document.getElementById(`waktu-${id}`).innerText = waktu;
            
            // Ubah warna indikator dot (berkedip hijau saat terima data)
            const dot = document.getElementById(`dot-${id}`);
            dot.className = "w-3 h-3 rounded-full bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]";
            setTimeout(() => {
                dot.className = "w-3 h-3 rounded-full bg-gray-500";
            }, 1000);
        }
    </script>
</body>
</html>
